<div class="ptcg-game-logs-header">
  <h4 class="ptcg-game-logs-header-text" translate>TABLE_LOGS</h4>
  <span class="ptcg-u-spacer"></span>
  <mat-icon *ngIf="hasReasons"
    class="ptcg-game-logs-reasons-toggle"
    [class.ptcg-game-logs-reasons-off]="!showReasons"
    (click)="toggleReasons()"
    [matTooltip]="(showReasons ? 'GAME_LOGS_HIDE_REASONS' : 'GAME_LOGS_SHOW_REASONS') | translate"
    matTooltipShowDelay="500">
    lightbulb_outline
  </mat-icon>
  <mat-icon (click)="clearLogs()"
    matTooltip="Clear logs"
    matTooltipShowDelay="1000">
    delete_outline
  </mat-icon>
</div>

<div class="ptcg-game-logs-content">
  <ul [class.ptcg-game-logs-hide-reasons]="!showReasons">
    <li *ngFor="let log of logs; trackBy: trackByFn"
      [class.ptcg-game-logs-reason]="log.isReason">
      <ng-container *ngIf="log.isReason; else plainLog">
        <span class="ptcg-game-logs-reason-label" [ngClass]="log.className">
          <mat-icon class="ptcg-game-logs-reason-icon">lightbulb_outline</mat-icon>{{ 'GAME_LOGS_WHY' | translate }}
        </span>
        {{ 'GAME_LOGS.' + log.message | translate: log.params }}
      </ng-container>
      <ng-template #plainLog>
        <span [class]="log.className">{{log.name}}</span>
        {{ 'GAME_LOGS.' + log.message | translate: log.params }}
      </ng-template>
    </li>
  </ul>
</div>

<div class="ptcg-game-logs-footer">
  <form class="game-logs-form" autocomplete="off">
    <mat-form-field floatLabel="never" appearance="legacy">
      <input
        #searchInput="matInput"
        name="message"
        maxlength="256"
        [(ngModel)]="message"
        [disabled]="isDeleted"
        type="text" matInput [placeholder]="'MESSAGES_ENTER_MESSAGE' | translate">
      <button mat-button matSuffix mat-icon-button
        [matTooltip]="'MESSAGES_SEND_MESSAGE' | translate"
        matTooltipShowDelay="1000"
        [disabled]="isDeleted"
        (click)="sendMessage()">
        <mat-icon>play_arrow</mat-icon>
      </button>
    </mat-form-field>
  </form>
</div>
