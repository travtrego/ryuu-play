<!--The content below is only a placeholder and can be replaced.-->
<ptcg-toolbar (logoClick)="sidenav.toggle()"></ptcg-toolbar>

<mat-sidenav-container [hasBackdrop]="isMobile">
  <mat-sidenav #sidenav
    [opened]="!isMobile"
    [mode]="isMobile ? 'over' : 'side'"
    class="ptcg-app-sidenav">
    <ptcg-sidenav (click)="onSidenavClick(sidenav)"></ptcg-sidenav>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
