name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint / test / compile (common, sets, simple-bot, server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # packages/cordova is deliberately excluded: its
      # cordova-plugin-statusbar-patched dependency is a plain-HTTP tarball on a
      # third-party host, which makes a full-workspace `npm ci` fail whenever
      # that host is unreachable. Building it also needs the Android SDK.
      # See docs/BUILD.md.
      - name: Install
        run: >-
          npm ci --include-workspace-root
          -w packages/common
          -w packages/sets
          -w packages/simple-bot
          -w packages/server
          -w packages/play

      # Order matters: each package's "main" points at dist/, so a package must
      # be compiled before the packages that depend on it can be tested.
      - name: common - lint
        run: npm run lint -w packages/common
      - name: common - test
        run: npm run test -w packages/common
      - name: common - compile
        run: npm run compile -w packages/common

      - name: sets - lint
        run: npm run lint -w packages/sets
      - name: sets - test
        run: npm run test -w packages/sets
      - name: sets - compile
        run: npm run compile -w packages/sets

      - name: simple-bot - lint
        run: npm run lint -w packages/simple-bot
      - name: simple-bot - test
        run: npm run test -w packages/simple-bot
      - name: simple-bot - compile
        run: npm run compile -w packages/simple-bot

      - name: server - lint
        run: npm run lint -w packages/server
      - name: server - test
        run: npm run test -w packages/server
      - name: server - compile
        run: npm run compile -w packages/server

  play:
    name: lint / build (play)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: >-
          npm ci --include-workspace-root
          -w packages/common
          -w packages/sets
          -w packages/simple-bot
          -w packages/server
          -w packages/play

      # packages/play imports @ptcg/common from its compiled output.
      - name: common - compile
        run: npm run compile -w packages/common

      - name: play - lint
        run: npm run lint -w packages/play
      - name: play - build
        run: npm run build -w packages/play
