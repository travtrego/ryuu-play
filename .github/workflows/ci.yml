name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new commit to the same PR makes the older run obsolete. Keeping only the
# newest run avoids burning Actions minutes and, more importantly, prevents a
# long queue from delaying the integration signal the agents actually need.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate current meta coverage report
        run: |
          node tools/meta-audit.js | tee meta-audit.txt
          node tools/meta-audit.js --json > meta-audit.json
          {
            echo '## Pokémon TCG Meta Coverage Audit'
            echo
            echo '```text'
            cat meta-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload meta coverage report
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit
          path: |
            meta-audit.txt
            meta-audit.json
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build --workspaces

      # Source scanning cannot tell whether the engine can actually construct a
      # deck. This runs after the build, when the compiled packages exist, and
      # fails if a deck the scan calls complete still will not build.
      - name: Verify decks build in the engine
        run: node tools/meta-audit.js --require-engine

      # Proves a game actually happens: real cards, bot taking legal actions
      # from first turn to last, somebody wins. Fails on an unfinished game or
      # any illegal action, either of which means the deck is not playable
      # whatever the coverage audit reports.
      - name: Play AI-vs-AI games
        run: node tools/play-match.js --runs 5 --random
