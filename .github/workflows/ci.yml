name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'gpt/**'
      - 'agent/**'
      - 'claude/**'

permissions:
  contents: read

jobs:
  meta-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate current meta coverage report
        run: |
          node tools/meta-audit.js | tee meta-audit.txt
          node tools/meta-audit.js --json > meta-audit.json
          {
            echo '## Pokémon TCG Meta Coverage Audit'
            echo
            echo '```text'
            cat meta-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload meta coverage report
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit
          path: |
            meta-audit.txt
            meta-audit.json
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build --workspaces
