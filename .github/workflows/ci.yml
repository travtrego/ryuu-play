name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'gpt/**'
      - 'agent/**'
      - 'claude/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - '@ptcg/common'
          - '@ptcg/sets'
          - '@ptcg/server'
          - '@ptcg/simple-bot'
          - '@ptcg/play'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build --workspace="${{ matrix.workspace }}"
