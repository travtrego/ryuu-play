name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'gpt/**'
      - 'agent/**'
      - 'claude/**'

permissions:
  contents: read

jobs:
  meta-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate current meta deck catalog
        run: node tools/meta-audit.js --json > /tmp/meta-audit.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build --workspaces
